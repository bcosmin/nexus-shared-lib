name: "Continuous Integration"

on:
  push:
    branches: [ "main", "feature/*", "hotfix/*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: "Verify Architecture Stack"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository Code"
        uses: actions/checkout@v4

      - name: "Set up Java 21 Runtime Environment"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: "Setup Gradle Cache & Engine"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # FIXED: Swapped out specific java tasks for universal lint/compilation checks
      - name: "Execute Groovy Lint & Code Style Checks"
        run: ./gradlew compileGroovy --continue

      # Executes your Spock unit tests and outputs compilation matrices
      - name: "Execute Spock Validation Suite"
        run: ./gradlew clean test --no-daemon

      - name: "Archive Test Execution Reports"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: build/reports/tests/test/